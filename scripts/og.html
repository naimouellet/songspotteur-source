<!doctype html>
<!-- Image d'aperçu des liens (public/og.png) et icônes de l'app (public/icon*.png).
     Régénérer :
       chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
       "$chrome" --headless --hide-scrollbars --window-size=1200,630 --screenshot=public/og.png "file://$PWD/scripts/og.html"
       "$chrome" --headless --hide-scrollbars --window-size=180,180 --screenshot=public/icon.png "file://$PWD/scripts/og.html#icon"
       "$chrome" --headless --hide-scrollbars --window-size=192,192 --screenshot=public/icon-192.png "file://$PWD/scripts/og.html#icon-192"
       "$chrome" --headless --hide-scrollbars --window-size=512,512 --screenshot=public/icon-512.png "file://$PWD/scripts/og.html#icon-512"
       "$chrome" --headless --hide-scrollbars --window-size=512,512 --screenshot=public/icon-maskable.png "file://$PWD/scripts/og.html#maskable-512"
     « maskable » : Android découpe l'icône en cercle ou en carré arrondi ; la grille
     couvre toute l'icône, et la forme allumée reste au centre, dans la partie gardée. -->
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    background: radial-gradient(120% 90% at 25% 0%, #123a8a 0%, #0a2058 45%, #07142f 100%);
    display: flex; align-items: center; gap: 72px; padding: 0 80px; box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
  }
  .art {
    flex: none; width: 430px; height: 430px; border-radius: 28px;
    background: radial-gradient(circle at 50% 45%, #141c3d 0%, #0b1029 55%, #070a1b 100%);
    box-shadow: 0 30px 70px rgba(0, 0, 0, .5);
  }
  canvas { width: 100%; height: 100%; display: block; }
  h1 { margin: 0; font-size: 84px; line-height: 1; font-weight: 700; letter-spacing: -.03em; }
  h1 span { color: #5b95ff; }
  p { margin: 22px 0 0; font-size: 34px; line-height: 1.25; color: rgba(235, 235, 245, .7); letter-spacing: -.01em; }
  .pill {
    display: inline-flex; align-items: center; gap: 12px; margin-top: 38px; padding: 14px 26px;
    border-radius: 999px; background: #1257e0; font-size: 28px; font-weight: 600;
  }
  .pill svg { width: 22px; height: 22px; fill: #fff; }

  /* Icône : seulement la grille de points, sur fond bleu, à la taille demandée. */
  body.icon { width: var(--size); height: var(--size); padding: 0; background: #1257e0; justify-content: center; }
  body.icon .art { width: var(--size); height: var(--size); border-radius: 0; background: none; box-shadow: none; }
  body.icon .text { display: none; }
</style>
</head>
<body>
  <div class="art"><canvas id="c"></canvas></div>
  <div class="text">
    <h1>MusiQuiz <span>QC</span></h1>
    <p>Reconnais une chanson québécoise<br>à partir d'un extrait<br>d'une demi-seconde.</p>
    <div class="pill"><svg viewBox="0 0 24 24"><path d="M8.2 5.3c0-.8.9-1.3 1.6-.9l9.6 6.3c.6.4.6 1.3 0 1.7l-9.6 6.3c-.7.4-1.6 0-1.6-.9z"/></svg>0,5 s</div>
  </div>
<script>
  // Même dessin que public/viz.js, figé sur une forme de chanson.
  // #icon (180 px), #icon-512, #maskable-512 : icône à cette taille ; sinon l'aperçu.
  const [, kind, px] = location.hash.match(/^#(icon|maskable)(?:-(\d+))?$/) || [];
  const icon = !!kind, size = Number(px) || 180;
  if (icon) {
    document.body.classList.add("icon");
    document.body.style.setProperty("--size", `${size}px`);
  }
  const c = document.getElementById("c"), g = c.getContext("2d");
  // Moins de points, plus gros, que dans le jeu : l'aperçu s'affiche souvent en petit.
  // Icônes : la grille couvre toute l'icône, chaque point au centre de sa case (comme
  // dans le jeu) ; l'aperçu garde une marge autour de la grille.
  // « maskable » : Android n'en garde que les 80 % du centre. Grille plus grande
  // (20 points) et forme dessinée dans ces 80 % : une fois découpée, elle ressemble
  // à l'icône normale (16 points).
  const maskable = kind === "maskable";
  const N = maskable ? 20 : icon ? 16 : 20, S = (icon ? size : 430) * 2;
  c.width = c.height = S;
  const step = icon ? S / N : S * 0.72 / (N - 1), x0 = icon ? step / 2 : S * 0.14, mid = (N - 1) / 2;
  const dot = step * (icon ? 0.2 : 0.17);
  const level = (x) => 0.18 + 0.5 * Math.exp(-((x - 0.2) ** 2) / 0.02) + 0.38 * Math.exp(-((x - 0.62) ** 2) / 0.03)
    + 0.06 * Math.sin(x * 40) - 0.12 * x;
  for (let col = 0; col < N; col++) {
    const u = maskable ? (col - 2) / (N - 5) : col / (N - 1); // maskable : 16 colonnes du centre
    const lv = u < 0 || u > 1 ? 0 : Math.max(0, Math.min(1, level(u)));
    for (let r = 0; r < N; r++) {
      const d = Math.abs(r - mid) / mid;
      const lit = Math.max(0, Math.min(1, (lv - d) * 5 + 0.5));
      const R = Math.round(255 + (91 - 255) * d), G = Math.round(255 + (149 - 255) * d);
      g.fillStyle = icon
        ? `rgba(255, 255, 255, ${0.25 + lit * 0.75})`
        : `rgba(${R}, ${G}, 255, ${0.06 + lit * (0.92 - d * 0.4)})`;
      g.beginPath();
      g.arc(x0 + col * step, x0 + r * step, dot * (1 + lit * 0.5), 0, Math.PI * 2);
      g.fill();
    }
  }
</script>
</body>
</html>
