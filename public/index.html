<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07142f">
  <title>MusiQuiz QC</title>
  <link rel="canonical" href="https://musiquizqc.com/">
  <meta property="og:title" content="MusiQuiz QC">
  <meta property="og:description" content="Reconnais une chanson québécoise à partir d'un extrait d'une demi-seconde.">
  <meta property="og:url" content="https://musiquizqc.com/">
  <meta property="og:type" content="website">
  <meta name="description" content="Reconnais une chanson québécoise à partir d'un extrait d'une demi-seconde.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231257e0'/%3E%3Cpath d='M13 10v12l9.5-6z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=1792702336">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><div class="layer" id="bgA"></div><div class="layer" id="bgB"></div></div>

  <header class="toolbar">
    <span class="app-name">MusiQuiz <span class="qc">QC</span></span>
    <div class="score" aria-live="polite">
      <span class="capsule" title="Série de bonnes réponses"><b id="streak">0</b> de suite</span>
      <span class="capsule" title="Meilleure série, gardée dans ce navigateur"><b id="best">0</b> record</span>
    </div>
  </header>

  <main class="now-playing">
    <div class="artwork" id="artwork">
      <img id="art" alt="">
      <canvas id="viz" aria-hidden="true"></canvas>
    </div>

    <div class="heading">
      <p class="eyebrow"><span id="round">Chanson 1</span><span class="verdict" id="verdict" hidden></span></p>
      <h1 id="songTitle">Quelle est cette chanson&#8239;?</h1>
      <p class="subline" id="songArtist">Écoute l'extrait, puis devine le titre.</p>
      <p class="meta" id="songMeta" hidden></p>
    </div>

    <ol class="segments" id="stages" aria-label="Extraits"></ol>

    <div class="controls">
      <button class="play" id="play" aria-label="Écouter l'extrait">
        <svg viewBox="0 0 24 24" class="icon-play" aria-hidden="true"><path d="M8.2 5.3c0-.8.9-1.3 1.6-.9l9.6 6.3c.6.4.6 1.3 0 1.7l-9.6 6.3c-.7.4-1.6 0-1.6-.9z"/></svg>
        <svg viewBox="0 0 24 24" class="icon-pause" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>
        <svg viewBox="0 0 24 24" class="icon-load" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="26 26"/></svg>
      </button>
    </div>
    <p class="sr-only" id="status" aria-live="polite"></p>
    <button class="pill" id="skip">Extrait plus long · 2 s</button>

    <div class="search" id="searchBox">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke-width="2"/><path d="m15 15 5 5" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="guess" type="search" autocomplete="off" spellcheck="false" placeholder="Titre de la chanson" aria-label="Titre de la chanson" aria-autocomplete="list" aria-controls="suggest">
      <button class="clear" id="clear" type="button" aria-label="Effacer" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8"/><path d="m5.5 5.5 5 5m0-5-5 5"/></svg></button>
      <ul id="suggest" class="group" role="listbox" hidden></ul>
    </div>

    <ul class="group attempts" id="attempts"></ul>

    <div class="actions" id="reveal" hidden>
      <button id="next" class="filled">Chanson suivante</button>
      <div class="open-in">
        <a id="apple" class="plain">Ouvrir dans une app de musique</a>
        <button id="appMenu" class="plain" type="button" aria-haspopup="menu" aria-label="Choisir l'app de musique"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
      </div>
    </div>
  </main>

  <section class="history" id="historyWrap" hidden>
    <h2>Cette partie</h2>
    <ol id="history"></ol>
  </section>

  <ul id="appChooser" class="group chooser" role="menu" aria-label="Ouvrir avec" hidden></ul>

  <footer class="fineprint">Extraits Deezer · Inspiré de <a href="https://songspot.co" target="_blank" rel="noopener">songspot</a> · VLMQ</footer>

  <script src="songs.js?v=1792702336"></script>
  <script src="bandcamp.js"></script>
  <script src="viz.js"></script>
  <script src="app.js?v=1792702336"></script>
</body>
</html>
